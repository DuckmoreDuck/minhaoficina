<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Veículos - Oficina</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Inicialização do Supabase (Ajuste com suas credenciais se necessário)
        const SUPABASE_URL = 'https://sua-url-supabase.supabase.co';
        const SUPABASE_KEY = 'sua-chave-anon-supabase';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>
</head>
<body>

    <!-- 🔒 TELA DE LOGIN -->
    <div id="login-screen" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #eef2f3;">
        <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px;">
            <h2 style="text-align: center; margin-bottom: 20px; color: #2c3e50;">🔐 Acesso Oficina</h2>
            <form id="form-login">
                <div style="margin-bottom: 15px;">
                    <label>Usuário:</label>
                    <input type="text" id="login-usuario" placeholder="Digite seu usuário" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label>Senha:</label>
                    <input type="password" id="login-senha" placeholder="Digite sua senha" required style="width: 100%; padding: 8px; margin-top: 5px;">
                </div>
                <button type="submit" id="btn-login" style="width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <!-- 🚗 CONTEÚDO PRINCIPAL DO PAINEL -->
    <div id="app-content" style="display: none; padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 10px 20px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            <span id="user-display" style="font-weight: bold; color: #34495e;">👤 Usuário: Carregando...</span>
            <button onclick="fazerLogout()" style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Sair</button>
        </div>

        <h1 style="text-align: center; color: #2c3e50; margin-bottom: 20px;">📋 Oficina - Controle de Veículos</h1>

        <!-- 📝 FORMULÁRIO DE CADASTRO E EDIÇÃO -->
        <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 25px;">
            <h3 id="form-title" style="margin-top: 0; color: #34495e;">Cadastrar Novo Veículo</h3>
            
            <form id="form-veiculo" onsubmit="event.preventDefault(); salvarVeiculo();">
                <input type="hidden" id="veiculo-id">
                
                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                    <div style="flex: 1; min-width: 120px;">
                        <label style="font-size: 12px; font-weight: bold;">OS / OR:</label>
                        <input type="text" id="os_or" placeholder="EX: 1024 / OR-50" style="width: 100%; padding: 6px;">
                    </div>
                    <div style="flex: 1; min-width: 120px;">
                        <label style="font-size: 12px; font-weight: bold;">Placa *:</label>
                        <input type="text" id="placa" placeholder="EX: ABC1D23" style="width: 100%; padding: 6px;" required>
                    </div>
                    <div style="flex: 2; min-width: 180px;">
                        <label style="font-size: 12px; font-weight: bold;">Cliente *:</label>
                        <input type="text" id="cliente" placeholder="NOME DO CLIENTE" style="width: 100%; padding: 6px;" required>
                    </div>
                    <div style="flex: 1; min-width: 130px;">
                        <label style="font-size: 12px; font-weight: bold;">Telefone:</label>
                        <input type="text" id="telefone" placeholder="(11) 99999-9999" style="width: 100%; padding: 6px;">
                    </div>
                    <div style="flex: 1; min-width: 130px;">
                        <label style="font-size: 12px; font-weight: bold;">Mecânico:</label>
                        <input type="text" id="mecanico" placeholder="NOME DO MECÂNICO" style="width: 100%; padding: 6px;">
                    </div>
                    <div style="flex: 1; min-width: 130px;">
                        <label style="font-size: 12px; font-weight: bold;">Data Agendamento:</label>
                        <input type="date" id="data_agendamento" style="width: 100%; padding: 6px;">
                    </div>
                    <div style="flex: 1; min-width: 130px;">
                        <label style="font-size: 12px; font-weight: bold;">Status Inicial:</label>
                        <select id="status" style="width: 100%; padding: 6px;">
                            <option value="AGENDADO">AGENDADO</option>
                            <option value="ENTRADA">ENTRADA</option>
                            <option value="EXECUÇÃO">EXECUÇÃO</option>
                            <option value="FINALIZADO">FINALIZADO</option>
                            <option value="RETIRADO">RETIRADO</option>
                        </select>
                    </div>
                </div>

                <!-- 📌 CAIXINHAS DE MARCAÇÃO -->
                <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e9ecef;">
                    <label style="cursor: pointer; font-size: 13px; font-weight: bold; color: #e65100;">
                        <input type="checkbox" id="chk_orcamento_pendente"> ⏳ Aguardando Orçamento
                    </label>
                    <label style="cursor: pointer; font-size: 13px; font-weight: bold; color: #2e7d32;">
                        <input type="checkbox" id="chk_orcamento_aprovado"> ✅ Orçamento Aprovado
                    </label>
                    <label style="cursor: pointer; font-size: 13px; font-weight: bold; color: #7b1fa2;">
                        <input type="checkbox" id="chk_aguardando_pecas"> 📦 Aguardando Peças
                    </label>
                    <div style="display: flex; gap: 8px; margin-left: auto;">
                        <input type="text" id="fornecedor" placeholder="Fornecedor (ex: AutoPeças)" style="font-size: 12px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px;">
                        <input type="text" id="codigo_peca" placeholder="Cód/Aviso (ex: #1042)" style="font-size: 12px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px;">
                    </div>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="font-size: 12px; font-weight: bold;">Observações:</label>
                    <textarea id="observacoes" placeholder="OBSERVAÇÕES DO VEÍCULO" style="width: 100%; height: 50px; padding: 6px;"></textarea>
                </div>

                <button type="button" id="btn-salvar" onclick="salvarVeiculo()" style="width: 100%; background: #27ae60; color: white; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px;">
                    Adicionar Veículo
                </button>
                <button type="button" id="btn-cancelar" onclick="limparFormulario()" style="display: none; width: 100%; background: #7f8c8d; color: white; padding: 8px; border: none; border-radius: 4px; margin-top: 5px; cursor: pointer;">
                    Cancelar
                </button>
            </form>
        </div>

        <!-- 🔍 BARRA DE PESQUISA -->
        <div style="margin-bottom: 15px;">
            <input type="text" id="busca-placa" oninput="renderizarPainel(this.value)" placeholder="🔍 PESQUISAR POR PLACA, CLIENTE OU OS/OR..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; text-transform: uppercase;">
        </div>

        <!-- 🔘 BOTÕES DE NAVEGAÇÃO DE ABAS (MOBILE) -->
        <div class="tabs-navigation" style="display: flex; gap: 5px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px;">
            <button class="tab-btn active" onclick="focarColuna('AGENDADO', this)">📅 AGENDADO</button>
            <button class="tab-btn" onclick="focarColuna('ENTRADA', this)">🚗 ENTRADA</button>
            <button class="tab-btn" onclick="focarColuna('EXECUÇÃO', this)">🛠️ EXECUÇÃO</button>
            <button class="tab-btn" onclick="focarColuna('FINALIZADO', this)">✅ FINALIZADO</button>
            <button class="tab-btn" onclick="focarColuna('RETIRADO', this)">🏁 RETIRADO</button>
        </div>

        <!-- 📊 COLUNAS KANBAN -->
        <div class="kanban-board" style="display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px;">
            <div class="kanban-column" id="col-AGENDADO" data-status="AGENDADO" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'AGENDADO')">
                <h3 style="background: #ebf5fb; color: #2980b9; padding: 10px; margin: 0; border-radius: 6px 6px 0 0;">📅 AGENDADO (0)</h3>
                <div class="cards-container" id="container-AGENDADO"></div>
            </div>

            <div class="kanban-column" id="col-ENTRADA" data-status="ENTRADA" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'ENTRADA')">
                <h3 style="background: #fef5e7; color: #d35400; padding: 10px; margin: 0; border-radius: 6px 6px 0 0;">🚗 ENTRADA (0)</h3>
                <div class="cards-container" id="container-ENTRADA"></div>
            </div>

            <div class="kanban-column" id="col-EXECUÇÃO" data-status="EXECUÇÃO" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'EXECUÇÃO')">
                <h3 style="background: #f4ecf7; color: #8e44ad; padding: 10px; margin: 0; border-radius: 6px 6px 0 0;">🛠️ EXECUÇÃO (0)</h3>
                <div class="cards-container" id="container-EXECUÇÃO"></div>
            </div>

            <div class="kanban-column" id="col-FINALIZADO" data-status="FINALIZADO" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'FINALIZADO')">
                <h3 style="background: #eafaf1; color: #27ae60; padding: 10px; margin: 0; border-radius: 6px 6px 0 0;">✅ FINALIZADO (0)</h3>
                <div class="cards-container" id="container-FINALIZADO"></div>
            </div>

            <div class="kanban-column" id="col-RETIRADO" data-status="RETIRADO" ondragover="allowDrop(event)" ondragleave="dragLeave(event)" ondrop="drop(event, 'RETIRADO')">
                <h3 style="background: #f2f4f4; color: #7f8c8d; padding: 10px; margin: 0; border-radius: 6px 6px 0 0;">🏁 RETIRADO (0)</h3>
                <div class="cards-container" id="container-RETIRADO"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
